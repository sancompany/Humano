<!--
  SAN & CO. — ícone PLACEHOLDER: Finanças
  >>> SUBSTITUA POR SEU PRÓPRIO ARQUIVO, mantendo o nome "finance.svg".
  Regras para o ícone funcionar na navegação:
    - viewBox 0 0 24 24 (quadrado);
    - traço/preenchimento em qualquer cor: a cor final é aplicada via CSS
      (mask-image), então o ícone assume automaticamente cinza quando inativo
      e dourado #D4AF37 quando ativo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <line x1="3.5" y1="20" x2="20.5" y2="20"/>
  <line x1="7" y1="20" x2="7" y2="14.5"/>
  <line x1="12" y1="20" x2="12" y2="10"/>
  <line x1="17" y1="20" x2="17" y2="5.5"/>
</svg>
